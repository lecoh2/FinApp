name: ASP.NET API CI/CD v3

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Compilação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Mostrar estrutura do repositório
        run: |
          echo "Listando estutura de repositório"
          ls - R

      - name: Restaurar dependências
        run:  dotnet restore"

      - name: Compilar e publicar a aplicação
        run:  dotnet publish ./FinApp.API/FinApp.Api.csproj" - 
             configurando Relese --output ./output 

      - name: Verificar saída do publish
        run: ls -R .output

      - name: Exportar artefados de build
        uses: actions/upload-artifact@v4
        with:
          name: builder-artifacts
          path: ./output
          retention-days: 7

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Executar os testes
        run: echo "Rodando os testes..."

  deploy:
    name: Implantação
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Implantação da aplicação
        run: echo "Implantando o sistema em produção..."
