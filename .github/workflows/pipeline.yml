name: ASP.NET API CI/CD

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Compilação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore ./FinancasApp.API/FinancasApp.API.csproj

      - name: Compilar e publicar a aplicação
        run: |
          dotnet publish ./FinancasApp.API/FinancasApp.API.csproj \
            --configuration Release \
            --output ./output

      - name: Exportar artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./output

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore ./FinancasApp.Infra.Data.Tests/FinancasApp.Infra.Data.Tests.csproj

      - name: Executar testes
        run: |
          dotnet test ./FinancasApp.Infra.Data.Tests/FinancasApp.Infra.Data.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=results.trx"

      - name: Exportar relatório de testes
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./TestResults

  deploy:
    name: Implantação
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Implantação da aplicação
        run: echo "Implantando o sistema em produção..."
