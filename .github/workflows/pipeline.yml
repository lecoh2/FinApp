name: ASP.NET API CI/CD v3

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Compilação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restaurar dependências
        run: dotnet restore"

      - name: Compilar a aplicação
        run: dotnet buil --configurarion Release --no-restore"

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Executar os testes
        run: echo "Rodando os testes..."

  deploy:
    name: Implantação
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Implantação da aplicação
        run: echo "Implantando o sistema em produção..."
